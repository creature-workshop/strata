jobs:
  - name: test
    needs: []
    script:
      - "echo \"hi\""
      - |
        one
          two # not a comment

        three
      - |-
        folded onto one line
        and a second
  - keep: |+
      kept

    name: deploy
    rules:
      - - nested
        - sequence
      - if: "$CI_COMMIT_TAG"
    strip: stripped
"on": push
stages:
  - build
  - test
variables:
  GIT_DEPTH: 1
  clean: true
  empty list: []
  empty map: {}
  escaped: |-
    a "quote",	a tab
    and a line
  flow:
    a: 1
    b:
      - x
      - "y, z"
    c: null
  nothing: null
  plain version: "1.2.3"
  ratio: -1.5e3
  "single 'quoted' key": "it's plain"
  tilde: null
  url: "http://example.com/a#b"
  version: "1.0"
