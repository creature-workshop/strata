# A document with every construct the reader takes.
title = "TOML example"                # a basic string
bare_key-1 = 1
"quoted key" = 2
'literal key' = 3
"" = "an empty key"
1234 = "a bare key of digits"
"ünïcödé" = "a key that is not bare"
site."google.com" = true              # a dotted key with a quoted segment
physical . color = "orange"           # whitespace around the dot
physical.shape = "round"

[strings]
basic = "I'm a string. \"You can quote me\". Name\tJos\u00E9\nLocation\tSF."
multiline_basic = """
Roses are red
Violets are blue"""
folded = """\
    The quick brown \
    fox jumps over \
    the lazy dog.\
    """
quotes = """Here are fifteen quotation marks: ""\"""\"""\"""\"""\"."""
inner = """"This," she said, "is just a pointless statement.""""
winpath = 'C:\Users\nodejs\templates'
regex = '<\i\c*\s*>'
multiline_literal = '''
The first newline is
trimmed in raw strings.
   All other whitespace
   is preserved.
'''
quot15 = '''Here are fifteen quotation marks: """""""""""""""'''
apos15 = "Here are fifteen apostrophes: '''''''''''''''"
str7 = ''''That,' she said, 'is still pointless.''''
unicode = "\U0001F600 and \u00e9"
escapes = "\b\f\r\\ and a raw	tab"
crlf = """a
b"""

[integers]
int1 = +99
int2 = 42
int3 = 0
int4 = -17
int5 = 1_000
int6 = 5_349_221
int7 = 53_49_221
hex1 = 0xDEADBEEF
hex2 = 0xdead_beef
oct1 = 0o01234567
oct2 = 0o755
bin1 = 0b11010110
big = 9223372036854775807
small = -9223372036854775808
negzero = -0

[floats]
flt1 = +1.0
flt2 = 3.1415
flt3 = -0.01
flt4 = 5e+22
flt5 = 1e06
flt6 = -2E-2
flt7 = 6.626e-34
flt8 = 224_617.445_991_228
zero = 0.0
negzero = -0.0

[booleans]
yes = true
no = false

[times]
ldt1 = 1979-05-27T07:32:00
ldt2 = 1979-05-27T00:32:00.999999
ld1 = 1979-05-27
lt1 = 07:32:00
lt2 = 00:32:00.999999

[arrays]
integers = [ 1, 2, 3 ]
colors = [ "red", "yellow", "green" ]
nested_arrays_of_ints = [ [ 1, 2 ], [3, 4, 5] ]
nested_mixed_array = [ [ 1, 2 ], ["a", "b", "c"] ]
string_array = [ "all", 'strings', """are the same""", '''type''' ]
numbers = [ 0.1, 0.2, 0.5, 1, 2, 5 ]
contributors = [
  "Foo Bar <foo@example.com>",
  { name = "Baz Qux", email = "bazqux@example.com", url = "https://example.com/bazqux" }
]
integers2 = [
  1, 2, 3
]
integers3 = [
  1,
  2, # this is ok
]
empty = []
tables = [ {}, { a = 1 } ]
dotted = [ { a.b = 1, a.c = 2 } ]

[tables]
[tables.empty]
[tables."quoted.segment"]
x = 1
[tables.dotted-header.deep]
y = 2
[tables.dotted-header]        # defined after its sub-table
z = 3
[ tables . spaced ]
w = 4
[tables.inline]
name = { first = "Tom", last = "Preston-Werner" }
point = { x = 1, y = 2 }
animal = { type.name = "pug" }
empty = {}

[[products]]
name = "Hammer"
sku = 738594937

[[products]]  # an empty table within the array

[[products]]
name = "Nail"
sku = 284758393
color = "gray"

[[fruits]]
name = "apple"

[fruits.physical]  # a sub-table of the last element
color = "red"
shape = "round"

[[fruits.varieties]]  # a nested array of tables
name = "red delicious"

[[fruits.varieties]]
name = "granny smith"

[[fruits]]
name = "banana"

[[fruits.varieties]]
name = "plantain"

[fruit]
apple.color = "red"
apple.taste.sweet = true

[fruit.apple.texture]  # a sub-table under a table a dotted key defined
smooth = true
