      ],
      "version": "24.20.0"
    }
  },
  "system": {
    "ca-certificates": {
      "version": "latest"
    },
    "curl": {
      "version": "latest"
    },
    "dash": {
      "version": "latest"
    },
    "git": {
      "version": "latest"
    },
    "jq": {
      "version": "1.7.1"
    },
    "mawk": {
      "version": "latest"
    },
    "unzip": {
      "version": "latest"
    }
  }
