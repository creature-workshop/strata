{
  "go-install": {
    "yq": {
      "pkg": "github.com/mikefarah/yq/v4",
      "version": "4.53.6"
    }
  },
  "npm": {
    "likec4": {
      "bin": "bin/likec4.mjs",
      "version": "1.59.3"
    }
  },
  "script": {
    "fnm": {
      "needs": [
        "curl",
